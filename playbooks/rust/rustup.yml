---
- name: Install rustup and binstall
  hosts: all
  tags: rust
  gather_facts: False
  tasks:
    - name: Download rustup-init
      get_url:
        url: "https://sh.rustup.rs"
        dest: /tmp/rustup-init
        timeout: 30
        force: true
        mode: 0755
      register: download
      until: download is success
      retries: 3
      delay: 5
      changed_when: false
    - name: Install rustup
      shell: /tmp/rustup-init -y
      changed_when: false
    - name: Install binstall
      # confirm interactive ask about sending statistic usage
      shell: yes | cargo install cargo-binstall --locked
      register: result
      # cargo prints status messages (incl. "already installed") to stderr
      changed_when: "'already installed' not in result.stderr"
