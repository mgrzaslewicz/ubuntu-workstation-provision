---
- name: Configure nvim
  hosts: all
  gather_facts: False
  tags: snap,editor,nvim
  tasks:
    - name: Install neovim
      become: true
      community.general.snap:
        name: nvim
        classic: true
    - name: Make sure nvim config directory exists
      file:
        path: "~/.config/nvim"
        state: directory
        mode: 0755
        access_time: preserve
        modification_time: preserve
