---
- name: Configure nvim
  hosts: all
  gather_facts: False
  tags: editor,nvim
  tasks:
    - name: Find mise binary path
      shell: command -v mise || echo ~/.local/bin/mise
      register: mise_path
      changed_when: false
    - name: Install latest neovim with mise
      shell: "{{ mise_path.stdout }} install neovim@latest"
      register: mise_install
      changed_when: "'installed' in mise_install.stdout or 'installing' in mise_install.stdout"
    - name: Set latest neovim as global default
      shell: "{{ mise_path.stdout }} use --global neovim@latest"
    - name: Make sure nvim config directory exists
      file:
        path: "~/.config/nvim"
        state: directory
        mode: 0755
        access_time: preserve
    - name: Install treesitter-cli for source syntax
      shell: cargo binstall --no-confirm tree-sitter-cli
      register: result
      # binstall logs status messages (incl. "already installed") to stderr
      changed_when: "'already installed' not in result.stdout + result.stderr"
